<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>solid-kr kdv-links</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, rgba(56, 189, 248, 0.18), transparent 25%),
          radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.16), transparent 18%),
          #08090f;
        color: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .card {
        width: min(100%, 520px);
        padding: 2rem;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.12);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.75rem;
      }

      .title {
        margin: 0;
        font-size: clamp(1.75rem, 2.5vw, 2.4rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0.5rem 0 0;
        color: #94a3b8;
      }

      .links {
        display: grid;
        gap: 1rem;
      }

      .link-card {
        display: block;
        padding: 1.2rem 1.4rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.12);
        color: #f8fafc;
        text-decoration: none;
        transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
      }

      .link-card:hover,
      .link-card:focus-visible {
        transform: translateY(-2px);
        background: rgba(148, 163, 184, 0.12);
        border-color: rgba(148, 163, 184, 0.24);
      }

      .link-title {
        font-size: 1rem;
        margin: 0 0 0.35rem;
        font-weight: 600;
      }

      .link-url {
        margin: 0;
        color: #cbd5e1;
        font-size: 0.95rem;
        word-break: break-all;
      }

      .footer {
        margin-top: 1.75rem;
        color: #64748b;
        font-size: 0.92rem;
        text-align: center;
      }

      .footer a {
        color: #38bdf8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="links">
        <a class="link-card" href="https://www.instagram.com/linksjugendsolid_krefeld/">
          <p class="link-title">Linksjugend Solid Krefeld</p>
          <p class="link-url">instagram.com/linksjugendsolid_krefeld</p>
        </a>
        <a class="link-card" href="https://www.instagram.com/streikgegenwehrpflicht_krefeld/">
          <p class="link-title">Streik Gegen Wehrpflicht Krefeld</p>
          <p class="link-url">instagram.com/streikgegenwehrpflicht_krefeld</p>
        </a>
        <a class="link-card" href="https://dfg-vk.de/verweigerung/">
          <p class="link-title">DFG-VK Verweigerung</p>
          <p class="link-url">dfg-vk.de/verweigerung</p>
        </a>
      </div>
    </main>
  </body>
</html>
